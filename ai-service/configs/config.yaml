# 非密钥默认值。优先级：环境变量 > .env > 本文件 > 代码默认值。
# 密钥、当前模型名及数据库连接串通过本地 .env 或环境变量配置。

server:
  host: "0.0.0.0"
  http_port: 8084
  workers: 1
  debug: false
  app_title: "AI Knowledge Base Service"
  app_version: "0.1.0"
  service_name: "ai-service"
  cors_origins: []
  cors_credentials: true
  cors_methods: ["GET", "POST", "PUT", "DELETE", "PATCH"]
  cors_headers: ["Content-Type", "Authorization", "X-Request-ID"]

database:
  url: "sqlite+aiosqlite:///./data/ai_kb.db"
  echo: false
  pool_size: 20

redis:
  url: "redis://localhost:6379/0"
  session_prefix: "session:"

session:
  access_token_expire: 7200
  refresh_token_expire: 604800
  token_header: "Authorization"
  token_prefix: "Bearer "

security:
  bcrypt_cost: 12
  max_request_body_size: 10000000

llm:
  provider: "zhipu"
  base_url: "https://open.bigmodel.cn/api/paas/v4"
  chat_model: "glm-4-flash"
  temperature: 0.1
  max_tokens: 4096
  timeout: 30
  keep_alive: "5m"

rag:
  chunk_size: 256
  chunk_overlap: 32
  rrf_k: 60
  query_expand_enabled: true
  max_query_variants: 3
  context_window: 1
  rerank_enabled: true
  min_relevance: 0.5
  retriever_provider: "hybrid"

reranker:
  provider: "zhipu"
  base_url: "https://open.bigmodel.cn/api/paas/v4"
  model: "rerank"
  timeout: 30

keyword_store:
  bm25_k1: 1.5
  bm25_b: 0.75

storage:
  upload_dir: "./data/uploads"

embedding:
  provider: "zhipu"
  base_url: "https://open.bigmodel.cn/api/paas/v4"
  model: "embedding-3"
  dimension: 1024
  batch_size: 32
  timeout: 30
  keep_alive: "5m"
  max_concurrency: 5

vector_store:
  provider: "pgvector"

rate_limit:
  enabled: true
  standard_limit: 60
  # 浏览器每次提问提交一个问答请求；跨库检索由后端协调
  heavy_limit: 120
  window_seconds: 60

prompt:
  template_dir: "./internal/prompt/templates"
  default_rag_template: "rag"

log:
  level: "INFO"
  format: "json"

# 面向模型的 token 预算；传输字节限制与原文字符坐标分别保留。
token_budget:
  input_limit: 16000
  output_limit: 2048
  total_tokens: 64000
  context_capacity: 1000000
  tool_result_max_tokens: 3000
  tool_result_max_bytes: 12000
  summary_tokens: 512
  page_tokens: 2000
  preview_tokens: 64
  safety_ratio: 0.1
  fixed_reserve_tokens: 256
  tokenizer_ref: "Qwen/Qwen3.8-Flash-Next@812d96e10a0dd82b69d749e68693698cf6c36daa"
